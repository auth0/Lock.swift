name: Run tests
description: Run library tests for a given platform

inputs:
  xcode:
    description: The version of Xcode to use
    required: true
  scheme:
    description: The Xcode scheme to use
    required: true
  platform:
    description: The platform to build for
    required: true

runs:
  using: composite

  steps:
    - name: Install xcpretty
      run: gem install xcpretty
      shell: bash

    - name: Run tests
      shell: bash
      run: |
        device=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^ *([^(]+) \(.*/\1/' | sed -E 's/ *$//')

        # Lock.xcodeproj and Package.swift coexist at the repo root; xcodebuild defaults
        # to the .xcodeproj, so it's moved aside to force resolution of the SPM package
        # (whose dependency graph, unlike Carthage's, builds cleanly on Apple Silicon runners).
        mv Lock.xcodeproj /tmp/Lock.xcodeproj

        set -o pipefail
        xcodebuild test \
          -scheme ${{ inputs.scheme }} \
          -destination "platform=${{ inputs.platform }} Simulator,name=$device" \
          -derivedDataPath DerivedData \
          -enableCodeCoverage YES \
          | xcpretty
        status=$?

        mv /tmp/Lock.xcodeproj Lock.xcodeproj
        exit $status
